<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synaptic Constellation Brain</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:radial-gradient(ellipse 55% 60% at 6% 92%,#7a1fd433,transparent 70%),radial-gradient(ellipse 50% 55% at 96% 18%,#1fe07a2b,transparent 70%),#050505;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  body.embed{background:transparent}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
  canvas:active{cursor:grabbing}
  #hint,#dl{position:fixed;bottom:14px;font-size:12px;color:#ffffffaa}
  #hint{left:50%;transform:translateX(-50%);pointer-events:none}
  #dl{right:14px;background:#ffffff14;border:1px solid #ffffff33;border-radius:999px;padding:6px 14px;cursor:pointer;color:#fff;font:inherit;font-size:12px}
  #dl:focus-visible{outline:2px solid #9b30ff;outline-offset:2px}
  body.embed #hint,body.embed #dl{display:none}

  /* Sleek glassmorphic node tooltip with smooth fade */
  #node-tooltip {
    position: absolute;
    background: rgba(5, 5, 5, 0.88);
    border: 1px solid #00FFFF;
    border-radius: 8px;
    padding: 8px 12px;
    color: white;
    font-family: monospace;
    font-size: 12px;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    z-index: 100;
    box-shadow: 0 0 16px rgba(0, 255, 255, 0.35);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: opacity 0.25s ease, transform 0.15s ease;
    white-space: nowrap;
    line-height: 1.4;
    transform: translate(0, 0);
  }
  #node-tooltip.visible {
    opacity: 1;
    visibility: visible;
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hint">Drag to rotate</div>
<button id="dl" type="button">Download .glb</button>
<div id="node-tooltip"></div>
<!--
  EMBED: <iframe src="synaptic-constellation-brain.html?embed" style="width:100%;height:520px;border:0" title="Synaptic constellation brain"></iframe>
  "?embed" = transparent background, no hint, no download button.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
<script>
/* ---------- brain-shaped constellation data (seeded, deterministic fallback) ---------- */
const SH={gap:6,rxLat:48,rxMed:.18,ry:36,rz:66},CXo=SH.gap/2+SH.rxMed*SH.rxLat;
function rng(a){return()=>{a|=0;a=a+0x6d2b79f5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function unit(r){const g=()=>Math.sqrt(-2*Math.log(r()||1e-9))*Math.cos(6.283185*r());const x=g(),y=g(),z=g(),l=Math.hypot(x,y,z)||1;return[x/l,y/l,z/l]}
function cerebrum(s,r){let u,med;do{u=unit(r);med=u[0]*s<0}while(med&&r()<.65);
  const[ux,uy,uz]=u,sh=r()<.86?1:.35+.5*Math.cbrt(r()),
  g=1+.07*Math.sin(6.1*ux+2.3*uz)*Math.cos(5.3*uy-1.7*ux)+.045*Math.sin(11*uz+3*uy),
  tp=1-.18*Math.max(0,uz)-.1*Math.max(0,-uz);
  return[s*CXo+ux*(med?SH.rxMed:1)*SH.rxLat*tp*g*sh,uy*SH.ry*(uy<0?.6:1)*g*sh,uz*SH.rz*g*sh]}
function cerebellum(s,r){const[ux,uy,uz]=unit(r),g=1+.09*Math.sin(15*uy);return[s*17+ux*17*g,-26+uy*10*g,-50+uz*13*g]}
function buildBrain(n,k,maxLen,longN,seed){
  const r=rng(seed),pts=[],hem=[];
  for(let i=0;i<n;i++){const s=i%2?1:-1;hem.push(s);pts.push(r()<.88?cerebrum(s,r):cerebellum(s,r))}
  const d=(a,b)=>Math.hypot(pts[a][0]-pts[b][0],pts[a][1]-pts[b][1],pts[a][2]-pts[b][2]);
  const E=new Set(),add=(a,b)=>E.add(a<b?a+'-'+b:b+'-'+a);
  for(let a=0;a<n;a++){const c=[];for(let b=0;b<n;b++)if(b!==a&&hem[b]===hem[a])c.push([d(a,b),b]);
    c.sort((p,q)=>p[0]-q[0]);c.slice(0,k).forEach((q,i)=>{if(i===0||q[0]<=maxLen)add(a,q[1])})}
  for(let i=0;i<longN;i++){const a=Math.floor(r()*n),b=Math.floor(r()*n);if(a!==b&&hem[a]===hem[b]&&d(a,b)<40)add(a,b)}
  const L=[],R=[];pts.forEach((p,i)=>{if(Math.abs(p[0])<CXo+6)(hem[i]<0?L:R).push(i)});
  for(let i=0;i<18&&L.length&&R.length;i++){const a=L[Math.floor(r()*L.length)];let best=-1,bd=1e9;
    for(const b of R){const x=d(a,b);if(x<bd){bd=x;best=b}}if(bd<22)add(a,best)}
  return{pts,edges:[...E].map(e=>e.split('-').map(Number)),idMap:new Map()};
}

/* ---------- Live Cortex API fetch with 2s timeout fallback ---------- */
async function fetchBrainData(fallbackFn){
  const controller=new AbortController();
  const timeoutId=setTimeout(()=>controller.abort(),2000);
  try{
    const res=await fetch('https://cortex-gamma-ten.vercel.app/api/brain',{signal:controller.signal});
    clearTimeout(timeoutId);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data||!Array.isArray(data.nodes)||data.nodes.length===0)throw new Error('Invalid nodes payload');
    const idMap=new Map(),pts=[];
    data.nodes.forEach((n,idx)=>{
      idMap.set(n.id,idx);
      const px=Number(n.fx!==undefined&&n.fx!==null?n.fx:(n.x||0));
      const py=Number(n.fy!==undefined&&n.fy!==null?n.fy:(n.y||0));
      const pz=Number(n.fz!==undefined&&n.fz!==null?n.fz:(n.z||0));
      pts.push([px,py,pz]);
    });
    const edges=[];
    if(Array.isArray(data.links)){
      data.links.forEach(l=>{
        const sId=typeof l.source==='object'&&l.source!==null?l.source.id:l.source;
        const tId=typeof l.target==='object'&&l.target!==null?l.target.id:l.target;
        const sIdx=idMap.get(sId),tIdx=idMap.get(tId);
        if(sIdx!==undefined&&tIdx!==undefined&&sIdx!==tIdx)edges.push([sIdx,tIdx]);
      });
    }
    console.info(`[Cortex] Connected to live API (${pts.length} nodes, ${edges.length} links).`);
    return {pts,edges,idMap,live:true};
  }catch(err){
    clearTimeout(timeoutId);
    console.warn('[Cortex] Live API fetch failed or timed out (2s). Gracefully falling back to static buildBrain().',err);
    return {...fallbackFn(),live:false};
  }
}

(async function(){
/* ---------------- TWEAK HERE ---------------- */
const NODES=900, K=4, MAX_LINK=22, LONG_LINKS=140, SEED=7;
const NODE_RADIUS=0.5;      // pure white, unlit
const LINK_OPACITY=0.3;     // hairline links
const STOPS=[[0,'#a23bff'],[.35,'#5a60ff'],[.65,'#2fb0b0'],[1,'#2bff88']]; // purple -> blue -> teal -> green (left -> right)
const SWAY=0.6;             // idle sway in radians (keeps purple on the left); 0 = off

const agents = [
  { name: 'Database Agent', file: 'dbaagent.md', id: 'dbaagent' },
  { name: 'Security Agent', file: 'securityagent.md', id: 'securityagent' },
  { name: 'UI/UX Agent', file: 'uiuxagent.md', id: 'uiuxagent' },
  { name: 'Product Manager', file: 'productmanageragent.md', id: 'productmanageragent' },
  { name: 'Systems Design', file: 'systemsdesignagent.md', id: 'systemsdesignagent' },
  { name: 'Integration Agent', file: 'integrationagent.md', id: 'integrationagent' },
  { name: 'Growth Agent', file: 'growthagent.md', id: 'growthagent' }
];
/* -------------------------------------------- */
const stage=document.getElementById('stage'),dl=document.getElementById('dl'),tooltip=document.getElementById('node-tooltip');
if(!window.THREE){stage.textContent='Could not load three.js. Check your connection.';return;}
if(/[?&]embed/.test(location.search))document.body.classList.add('embed');
if(!THREE.GLTFExporter)dl.hidden=true;
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});}
catch(e){stage.textContent='WebGL is not available in this browser.';return;}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(32,1,1,2000);

const {pts,edges,idMap}=await fetchBrainData(()=>buildBrain(NODES,K,MAX_LINK,LONG_LINKS,SEED));

/* nodes: ONE merged mesh of tiny flat-white spheres */
const tpl=new THREE.SphereGeometry(NODE_RADIUS,7,5),tp=tpl.attributes.position.array,tn=tpl.attributes.normal.array,ti=tpl.index.array;
const nv=tp.length/3,P=new Float32Array(pts.length*tp.length),N=new Float32Array(pts.length*tp.length),I=new Uint32Array(pts.length*ti.length);
pts.forEach((p,j)=>{
  for(let v=0;v<nv;v++){const o=j*tp.length+v*3;P[o]=tp[v*3]+p[0];P[o+1]=tp[v*3+1]+p[1];P[o+2]=tp[v*3+2]+p[2];N[o]=tn[v*3];N[o+1]=tn[v*3+1];N[o+2]=tn[v*3+2];}
  for(let t=0;t<ti.length;t++)I[j*ti.length+t]=ti[t]+j*nv;
});
const ng=new THREE.BufferGeometry();
ng.setAttribute('position',new THREE.BufferAttribute(P,3));ng.setAttribute('normal',new THREE.BufferAttribute(N,3));ng.setIndex(new THREE.BufferAttribute(I,1));
const nodeMesh=new THREE.Mesh(ng,new THREE.MeshBasicMaterial({color:0xffffff}));nodeMesh.name='Constellation_Nodes';

/* links: hairline segments, colour = purple->green by x */
const stops=STOPS.map(s=>[s[0],new THREE.Color(s[1])]),tmp=new THREE.Color();
function colorAt(x){const t=Math.min(1,Math.max(0,(x+60)/120));let i=1;while(i<stops.length-1&&t>stops[i][0])i++;
  const a=stops[i-1],b=stops[i];return tmp.copy(a[1]).lerp(b[1],(t-a[0])/(b[0]-a[0])).convertSRGBToLinear();}
const LP=new Float32Array(edges.length*6),LC=new Float32Array(edges.length*6);
edges.forEach((e,j)=>{e.forEach((id,s)=>{const p=pts[id],o=j*6+s*3,c=colorAt(p[0]);
  LP[o]=p[0];LP[o+1]=p[1];LP[o+2]=p[2];LC[o]=c.r;LC[o+1]=c.g;LC[o+2]=c.b;});});
const lg=new THREE.BufferGeometry();
lg.setAttribute('position',new THREE.BufferAttribute(LP,3));lg.setAttribute('color',new THREE.BufferAttribute(LC,3));
const links=new THREE.LineSegments(lg,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:LINK_OPACITY,depthWrite:false}));
links.name='Constellation_Links';

const model=new THREE.Group();model.name='synaptic-constellation-brain';model.add(links,nodeMesh);

/* ---------- The 7 Core Agent Nodes (Beacons, Halo Rings & Invisible Hit Targets) ---------- */
const agentMeshes=[];
const agentHitObjects=[];
const beaconGeom=new THREE.SphereGeometry(1.6,16,16);
const ringGeom=new THREE.RingGeometry(2.2,3.0,24);
const hitGeom=new THREE.SphereGeometry(6.0,10,10);
// Hit material: transparent with opacity 0 ensures raycaster intersects it while staying invisible
const hitMat=new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false});

agents.forEach((agent,i)=>{
  // Find point from idMap if live data has matching ID, otherwise use first 7 points
  let ptIndex=i;
  if(idMap&&idMap.has(agent.id)){
    ptIndex=idMap.get(agent.id);
  }
  if(!pts[ptIndex])return;
  const p=pts[ptIndex];
  const pos=new THREE.Vector3(p[0],p[1],p[2]);

  // Visual glowing agent beacon
  const beaconMat=new THREE.MeshBasicMaterial({color:0x00ffff});
  const beacon=new THREE.Mesh(beaconGeom,beaconMat);
  beacon.position.copy(pos);
  model.add(beacon);

  // Outer pulse halo ring
  const ringMat=new THREE.MeshBasicMaterial({
    color:0x00ffff,
    side:THREE.DoubleSide,
    transparent:true,
    opacity:0.75
  });
  const ring=new THREE.Mesh(ringGeom,ringMat);
  ring.position.copy(pos);
  model.add(ring);

  // Raycastable hit mesh
  const hitMesh=new THREE.Mesh(hitGeom,hitMat);
  hitMesh.position.copy(pos);
  hitMesh.userData={agent,index:i,pos,beacon,ring};
  model.add(hitMesh);

  agentMeshes.push({agent,beacon,ring,pos,index:i});
  agentHitObjects.push(hitMesh);
});

const rig=new THREE.Group();rig.add(model);scene.add(rig);

/* ---------- Raycaster & Interaction State ---------- */
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2(-9999,-9999);
const tempV=new THREE.Vector3();
let hoveredAgent=null,pinnedAgent=null;
let mouseOnScreen=false,rawClientX=0,rawClientY=0;
let lastRenderedAgent=null;

/* ---------- Pointer Events (Track Mouse Position) ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,el=renderer.domElement;
let yaw=0,pitch=0.5,vel=0,drag=false,lx=0,ly=0,idle=0,downX=0,downY=0;

el.addEventListener('pointerdown',e=>{
  drag=true;
  lx=e.clientX;ly=e.clientY;
  downX=e.clientX;downY=e.clientY;
  el.setPointerCapture(e.pointerId);
});

el.addEventListener('pointermove',e=>{
  mouseOnScreen=true;
  rawClientX=e.clientX;
  rawClientY=e.clientY;

  const rect=el.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;

  if(drag){
    const dx=e.clientX-lx,dy=e.clientY-ly;
    lx=e.clientX;ly=e.clientY;
    vel=dx*0.01;yaw+=vel;pitch=Math.max(-1.3,Math.min(1.3,pitch+dy*0.008));idle=0;
  }
});

el.addEventListener('pointerleave',()=>{
  mouseOnScreen=false;
  mouse.set(-9999,-9999);
});

const up=(e)=>{
  drag=false;
  const moved=Math.hypot(e.clientX-downX,e.clientY-downY);
  if(moved<6){
    // Click or tap on node
    if(hoveredAgent){
      pinnedAgent=(pinnedAgent&&pinnedAgent.index===hoveredAgent.index)?null:hoveredAgent;
    }else{
      pinnedAgent=null;
    }
  }
};
el.addEventListener('pointerup',up);
el.addEventListener('pointercancel',up);

function resize(){const w=stage.clientWidth||innerWidth,h=stage.clientHeight||innerHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;const t=Math.tan(camera.fov*Math.PI/360)*2;
  camera.position.set(0,0,Math.max(150/(t*camera.aspect),140/t));camera.updateProjectionMatrix();}
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);addEventListener('resize',resize);resize();

/* ---------- Animation & Raycasting Tick Loop ---------- */
const clock=new THREE.Clock();
(function tick(){requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;
  if(!drag){idle+=dt;
    if(Math.abs(vel)>0.0005){yaw+=vel;vel*=0.95;}
    else if(!reduce&&SWAY>0&&idle>1.5)yaw+=(Math.sin(t*0.25)*SWAY-yaw)*0.02;
    pitch+=(0.5-pitch)*(idle>3?0.01:0);}
  rig.rotation.y=yaw;rig.rotation.x=pitch;

  // Make sure model's world matrix is current for raycasting & projection
  model.updateMatrixWorld(true);

  // 1. Raycast in the tick loop to detect if user is hovering over an agent node
  if(!drag&&mouseOnScreen){
    raycaster.setFromCamera(mouse,camera);
    const intersects=raycaster.intersectObjects(agentHitObjects,false);
    if(intersects.length>0){
      hoveredAgent=intersects[0].object.userData;
    }else{
      // Proximity check in 2D screen space (< 28px) as a seamless fallback
      let closest=null,minDist=28;
      const rect=el.getBoundingClientRect();
      agentMeshes.forEach(item=>{
        tempV.copy(item.pos).applyMatrix4(model.matrixWorld);
        tempV.project(camera);
        if(tempV.z<1){
          const sx=(tempV.x*0.5+0.5)*rect.width+rect.left;
          const sy=(-tempV.y*0.5+0.5)*rect.height+rect.top;
          const dist=Math.hypot(rawClientX-sx,rawClientY-sy);
          if(dist<minDist){minDist=dist;closest=item;}
        }
      });
      hoveredAgent=closest;
    }
  }else if(drag){
    hoveredAgent=null;
  }

  // 2. Animate and billboard the core agent halo rings
  agentMeshes.forEach((item,idx)=>{
    item.ring.quaternion.copy(camera.quaternion);
    const isAct=(hoveredAgent&&hoveredAgent.index===idx)||(pinnedAgent&&pinnedAgent.index===idx);
    const pulse=isAct?1.45:(1+Math.sin(t*3.5+idx)*0.18);
    item.ring.scale.set(pulse,pulse,1);
    item.beacon.scale.setScalar(isAct?1.5:1);
  });

  // 3. Move and update the tooltip if hovering or pinned
  const activeItem=hoveredAgent||pinnedAgent;
  if(activeItem&&activeItem.pos){
    tempV.copy(activeItem.pos).applyMatrix4(model.matrixWorld);
    tempV.project(camera);
    if(tempV.z<1){
      const w=stage.clientWidth||innerWidth;
      const h=stage.clientHeight||innerHeight;
      const sx=(tempV.x*0.5+0.5)*w;
      const sy=(-tempV.y*0.5+0.5)*h;

      // Position tooltip right next to the node with boundary safety
      const tooltipW=180;
      const left=Math.min(w-tooltipW-16,Math.max(12,sx+16));
      const top=Math.min(h-55,Math.max(12,sy-20));
      tooltip.style.left=left+'px';
      tooltip.style.top=top+'px';

      // Update text to display Agent name and .md filename
      if(lastRenderedAgent!==activeItem.agent.name){
        tooltip.innerHTML=`<div style="font-weight:700;color:#00FFFF;margin-bottom:2px;display:flex;align-items:center;gap:6px;">
          <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#00FFFF;box-shadow:0 0 8px #00FFFF;"></span>
          ${activeItem.agent.name}
        </div>
        <div style="color:#94a3b8;font-size:11px;letter-spacing:0.02em;">
          📄 ${activeItem.agent.file}
        </div>`;
        lastRenderedAgent=activeItem.agent.name;
      }

      tooltip.classList.add('visible');
      el.style.cursor='pointer';
    }else{
      tooltip.classList.remove('visible');
      el.style.cursor=drag?'grabbing':'grab';
    }
  }else{
    tooltip.classList.remove('visible');
    if(!drag)el.style.cursor='grab';
    lastRenderedAgent=null;
  }

  renderer.render(scene,camera);
})();

/* ---------- export as .glb ---------- */
dl.addEventListener('click',()=>{if(!THREE.GLTFExporter)return;
  new THREE.GLTFExporter().parse(model,res=>{const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([res],{type:'model/gltf-binary'}));a.download='synaptic-constellation-brain.glb';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);},{binary:true});});
})();
</script>
</body>
</html>
